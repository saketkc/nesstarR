<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1154" viewBox="0 0 1000 1154">
  <!-- hex, same geometry and palette as mospiR -->
  <polygon points="500,37 967.6,307 967.6,847 500,1117 32.4,847 32.4,307"
           fill="#1C1C1E" stroke="#48484A" stroke-width="16" stroke-linejoin="round"/>

  <!-- roof over a grid of answered and blank cells: a household survey record -->
