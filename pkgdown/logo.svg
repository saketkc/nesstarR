    <polyline points="290,500 500,320 710,500" fill="none" stroke="#4F7CFF"
              stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#4F7CFF">
      <rect x="335" y="535" width="90" height="90" rx="14"/>
      <rect x="575" y="535" width="90" height="90" rx="14"/>
      <rect x="455" y="655" width="90" height="90" rx="14"/>
      <rect x="575" y="655" width="90" height="90" rx="14"/>
      <rect x="335" y="775" width="90" height="90" rx="14"/>
    </g>
    <g fill="none" stroke="#4F7CFF" stroke-opacity="0.45" stroke-width="10">
      <rect x="460" y="540" width="80" height="80" rx="10"/>
      <rect x="340" y="660" width="80" height="80" rx="10"/>
      <rect x="460" y="780" width="80" height="80" rx="10"/>
      <rect x="580" y="780" width="80" height="80" rx="10"/>
    </g>
  </g>

  <text x="500" y="880" font-family="SF Pro Display, Albert Sans, Helvetica Neue, Arial, sans-serif"
        font-size="150" fill="#F5F5F7" text-anchor="middle">nesstarR</text>
</svg>
