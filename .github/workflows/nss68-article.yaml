on:
  pull_request:
    branches: [main]
    paths:
      - "R/**"
      - "src/**"
      - "DESCRIPTION"
      - "vignettes/articles/nss68.Rmd"
      - ".github/workflows/nss68-article.yaml"
  workflow_dispatch:

name: nss68-article

permissions: read-all

jobs:
  nss68-article:
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MOSPI_KEY: ${{ secrets.MOSPI_KEY }}
      DATA_DIR: vignettes/articles/data/DDI-IND-MOSPI-NSSO-68Rnd-Sch2.0-July2011-June2012

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rmarkdown, local::.
          needs: website

      # Linux tests the unar fallback; macOS and Windows test the bundled libarchive
      - name: Install unar
        if: runner.os == 'Linux'
        run: sudo apt-get install -y unar

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.DATA_DIR }}/*.rar
            ${{ env.DATA_DIR }}/*.zip
          key: nss68-DDI-IND-MOSPI-NSSO-68Rnd-Sch2.0-July2011-June2012
          enableCrossOsArchive: true

      - name: Render article
        shell: Rscript {0}
        run: |
          rmarkdown::render("vignettes/articles/nss68.Rmd", output_dir = tempdir())
          # fail if the article ran without data
          stopifnot(dir.exists(file.path(Sys.getenv("DATA_DIR"), "nesstar")))
